name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EDI API ${{ github.ref_name }}'
          releaseBody: |
            ## EDI API ${{ github.ref_name }}
            
            ### Downloads
            - **Portable (.exe)**: `edi-api.exe` - Copie para o desktop e execute
            - **Instalador (.exe)**: `EDI API_${{ github.ref_name }}_x64-setup.exe` - Instalador completo
            
            ### Mudanças
            Ver CHANGELOG.md para detalhes.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          assets: |
            src-tauri/target/release/edi-api.exe
            src-tauri/target/release/bundle/nsis/*.exe
        timeout-minutes: 30