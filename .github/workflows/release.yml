name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: edi-api

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edi-api/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edi-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EDI API ${{ github.ref_name }}'
          releaseBody: |
            ## EDI API ${{ github.ref_name }}
            
            ### Downloads
            - **Portable (.exe)**: `edi-api.exe` - Copie para o desktop e execute
            - **Instalador (.exe)**: `EDI API_${{ github.ref_name }}_x64-setup.exe` - Instalador completo
            
            ### Mudanças
            Ver CHANGELOG.md para detalhes.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
          assets: |
            src-tauri/target/x86_64-pc-windows-msvc/release/edi-api.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
        timeout-minutes: 30
