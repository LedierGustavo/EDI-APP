[package]
name = "edi-api"
version = "0.1.0"
description = "EDI API Desktop Application for Braspress"
authors = ["Braspress Team"]
license = "MIT"
repository = "https://github.com/braspress/edi-api"
edition = "2024"
rust-version = "1.90"

[lib]
name = "edi_api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
keyring = "4.2"
base64 = "0.22"
anyhow = "1.0"
thiserror = "1.0"
